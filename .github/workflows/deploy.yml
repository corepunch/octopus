name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '7,22,37,52 * * * *'
  # Allow running manually from the Actions tab
  workflow_dispatch:

# Grant GITHUB_TOKEN the permissions needed for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment at a time; cancel in-flight runs
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xsltproc fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/preview-requirements.txt

      - name: Install preview dependencies
        run: pip install -r scripts/preview-requirements.txt

      - name: Test previews
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Build site into dist/
        run: bash scripts/build.sh

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Generate public post previews
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/post_previews.py --site-url "$SITE_URL"


      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploy only the generated dist/ directory
          path: "dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
