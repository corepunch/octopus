name: Auto Post (Interest-Based News)

on:
  # Run manually from the Actions tab
  workflow_dispatch:
    inputs:
      users:
        description: "Which seed users should post (space-separated: alice bob carol)"
        required: false
        default: "alice bob carol"
        type: string

permissions:
  contents: read

jobs:
  auto-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get install -y jq

      - name: Auto-post from interests
        env:
          APPWRITE_API_KEY:    ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_ENDPOINT:   "https://fra.cloud.appwrite.io/v1"
          APPWRITE_PROJECT_ID: "69f1c06800389dc6a1a0"
          POST_AS:             ${{ github.event.inputs.users }}
        run: bash scripts/auto-post.sh
