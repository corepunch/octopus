name: Post preview tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core xsltproc
      - run: pip install -r scripts/preview-requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: bash scripts/build.sh
